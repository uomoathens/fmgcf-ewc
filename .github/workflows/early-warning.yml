name: Early warning run

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Month used to refresh downloaded data
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: .cache/ewc
          key: ewc-data-${{ steps.month.outputs.value }}
      - name: Synthetic demonstration
        run: fmgcf-ewc run --config configs/synthetic.yaml --output outputs/synthetic --summary "$GITHUB_STEP_SUMMARY"
      - name: Real data, Southern Europe (Eurostat and Open-Meteo)
        if: always()
        run: fmgcf-ewc run --config configs/europe_south.yaml --output outputs/europe_south --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: early-warning-reports
          path: outputs/
          retention-days: 90
